                          onChange={(e) => setFoundForm({ ...foundForm, secretAnswer: e.target.value })}
                          placeholder="Expected keyword answer"
                          className="w-full h-9 px-3 rounded-lg border border-[#9CE5EC] bg-white text-xs outline-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="tactile-btn w-full h-11 rounded-xl bg-[#33B8C8] text-white text-sm font-medium"
                      >
                        Publish Found Tag
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* =====================================================
              OWNERSHIP VERIFICATION MODAL
             ===================================================== */}
          {verifyTarget && (
            <div
              onClick={(e) => { if (e.target === e.currentTarget) setVerifyTarget(null); }}
              className="fixed inset-0 z-50 bg-[#33B8C8]/35 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div className="animate-modal-in w-full max-w-md bg-white rounded-2xl border border-[#9CE5EC] overflow-hidden">
                <div className="px-6 py-4 border-b border-[#9CE5EC] flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="ShieldCheck" className="w-4 h-4 text-[#F8C12C]" />
                    <h3 className="font-display font-semibold text-base text-[#0b4757]">Verify Ownership</h3>
                  </div>
                  <button onClick={() => setVerifyTarget(null)} className="text-[#33B8C8] hover:text-[#0b4757]">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {(() => {
                  const activeClaim = verifySubmittedClaimId
                    ? claims.find((c) => c.id === verifySubmittedClaimId)
                    : null;
                  if (activeClaim) {
                    return (
                      <div className="p-6 space-y-4">
                        <div className="p-3.5 rounded-xl bg-[#9CE5EC]/20 border border-[#9CE5EC]">
                          <span className="font-mono-id text-[11px] text-[#33B8C8]">#{verifyTarget.foundItem.id} · {verifyTarget.foundItem.zone}</span>
                          <p className="text-sm font-medium text-[#0b4757] mt-0.5">{verifyTarget.foundItem.title}</p>
                        </div>

                        {activeClaim.status === 'approved' ? (
                          <div className="p-4 rounded-xl border border-emerald-200 bg-emerald-50 space-y-3 text-center">
                            <p className="text-sm font-semibold text-emerald-800">Verified by the Finder!</p>
                            <p className="text-xs text-emerald-700">Show this 4-digit Handover PIN when picking up your item:</p>
                            <div className="font-mono-id text-2xl font-bold tracking-widest text-[#0b4757] py-1">
                              {activeClaim.handover_pin}
                            </div>
                            <button
                              type="button"
                              onClick={() => openHandoverChatForClaim(activeClaim)}
                              className="tactile-btn w-full h-10 rounded-xl bg-[#33B8C8] text-white text-sm font-medium cursor-pointer"
                            >
                              Open Secure Handover Chat
                            </button>
                          </div>
                        ) : activeClaim.status === 'rejected' ? (
                          <div className="p-4 rounded-xl border border-red-200 bg-red-50 space-y-3">
                            <p className="text-sm font-semibold text-red-700">Answer Rejected by Finder</p>
                            <p className="text-xs text-red-600">
                              The person who reported this item marked your answer as not matching. You can submit a clearer detail below.
                            </p>
                            <button
                              type="button"
                              onClick={() => setVerifySubmittedClaimId(null)}
                              className="tactile-btn w-full h-9 rounded-xl bg-[#F8C12C] text-[#0b4757] text-xs font-medium cursor-pointer"
                            >
                              Try Another Detail
                            </button>
                          </div>
                        ) : (
                          <div className="p-4 rounded-xl border border-[#9CE5EC] bg-[#9CE5EC]/15 space-y-2.5">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-semibold text-[#0b4757]">Sent to Finder for Verification</span>
                              <span className="px-2 py-0.5 rounded-full text-[11px] font-medium bg-[#F8C12C]/30 text-[#0b4757]">
                                Pending
                              </span>
                            </div>
                            <p className="text-xs text-[#33B8C8] leading-relaxed">
                              Your answer (“{activeClaim.answer}”) has been sent to the person who reported this Found item. Once they approve it in their account, your Handover PIN will unlock here automatically.
                            </p>
                            <div className="flex gap-2 pt-1">
                              <button
                                type="button"
                                onClick={() => fetchClaims()}
                                className="tactile-btn flex-1 h-9 rounded-xl border border-[#9CE5EC] bg-white text-[#0b4757] text-xs font-medium cursor-pointer"
                              >
                                Refresh Status
                              </button>
                              <button
                                type="button"
                                onClick={() => setVerifyTarget(null)}
                                className="tactile-btn flex-1 h-9 rounded-xl bg-[#33B8C8] text-white text-xs font-medium cursor-pointer"
                              >
                                Done
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  }
                  return (
                    <form onSubmit={submitVerification} className="p-6 space-y-4">
                      <div className="p-3.5 rounded-xl bg-[#9CE5EC]/20 border border-[#9CE5EC]">
                        <span className="font-mono-id text-[11px] text-[#33B8C8]">#{verifyTarget.foundItem.id} · {verifyTarget.foundItem.zone}</span>
                        <p className="text-sm font-medium text-[#0b4757] mt-0.5">{verifyTarget.foundItem.title}</p>
                      </div>

                      <div>
                        <p className="text-xs font-medium text-[#33B8C8] mb-1.5">Finder’s Verification Prompt</p>
                        <p className="text-sm text-[#0b4757] p-3.5 rounded-xl border border-[#9CE5EC] bg-white">
                          {verifyTarget.foundItem.secretQuestion || 'Describe one distinguishing mark, sticker, or personal detail on this item to confirm ownership.'}
                        </p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-medium text-[#0b4757] mb-1">Your Name</label>
                          <input
                            type="text"
                            value={verifyClaimantName}
                            onChange={(e) => { setVerifyClaimantName(e.target.value); setVerifyErr(''); }}
                            placeholder="Your full name"
                            className="w-full h-9 px-3 rounded-xl border border-[#9CE5EC] focus:border-[#33B8C8] text-xs outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-[#0b4757] mb-1">Your Email</label>
                          <input
                            type="email"
                            value={verifyClaimantEmail}
                            onChange={(e) => { setVerifyClaimantEmail(e.target.value); setVerifyErr(''); }}
                            placeholder="you@campus.edu"
                            className="w-full h-9 px-3 rounded-xl border border-[#9CE5EC] focus:border-[#33B8C8] text-xs outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-[#0b4757] mb-1.5">Your Answer (reviewed by the finder)</label>
                        <input
                          type="text"
                          value={verifyInput}
                          onChange={(e) => { setVerifyInput(e.target.value); setVerifyErr(''); }}
                          placeholder="Enter matching detail..."
                          className="w-full h-10 px-3.5 rounded-xl border border-[#9CE5EC] focus:border-[#33B8C8] text-sm outline-none"
                          autoFocus
                        />
                        {verifyErr && (
                          <p className="text-xs text-red-600 mt-1.5 flex items-center gap-1">
                            <Icon name="AlertCircle" className="w-3.5 h-3.5" />
                            {verifyErr}
                          </p>
                        )}
                      </div>

                      <button
                        type="submit"
                        disabled={verifySubmitting}
                        className="tactile-btn w-full h-10 rounded-xl bg-[#F8C12C] hover:brightness-95 text-[#0b4757] text-sm font-medium cursor-pointer disabled:opacity-60"
                      >
                        {verifySubmitting ? 'Sending to Finder...' : 'Send Answer to Finder for Verification'}
                      </button>
                    </form>
                  );
                })()}
              </div>
            </div>
          )}

          {/* =====================================================
              IN-APP SECURE CHAT & 4-DIGIT HANDOVER PIN DRAWER
             ===================================================== */}
          {activeChatMatch && (
            <div
              onClick={(e) => { if (e.target === e.currentTarget) setActiveChatMatchId(null); }}
              className="fixed inset-0 z-50 flex justify-end bg-[#33B8C8]/30 backdrop-blur-sm"
            >
              <div className="animate-drawer-in w-full max-w-md bg-white h-full border-l border-[#9CE5EC] flex flex-col">
                <div className="px-6 py-4 border-b border-[#9CE5EC] flex items-center justify-between">
                  <div>
                    <h3 className="font-display font-semibold text-base text-[#0b4757]">
                      Secure Handover · #{activeChatMatch.foundItem.id}
                    </h3>
                    <p className="text-xs text-[#33B8C8]">{activeChatMatch.foundItem.zone} · Verified</p>
                  </div>
                  <button onClick={() => setActiveChatMatchId(null)} className="text-[#33B8C8] hover:text-[#0b4757]">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-4 border-b border-[#9CE5EC] bg-[#9CE5EC]/20">
                  <div className="p-3.5 rounded-xl bg-white border border-[#9CE5EC] flex items-center justify-between gap-3">
                    {activeChatMatch.handoverPin ? (
                      <>
                        <div>
                          <span className="text-[10px] uppercase tracking-wider text-[#33B8C8] block">Handover PIN</span>
                          <span className="font-mono-id text-xl font-semibold tracking-widest text-[#F8C12C]">
                            {activeChatMatch.handoverPin}
                          </span>
                        </div>
                        <button
                          onClick={() => markReunited(activeChatMatch.id)}
                          className="tactile-btn h-9 px-3.5 rounded-xl bg-[#F8C12C] text-[#0b4757] text-xs font-medium"
                        >
                          Mark Reunited
                        </button>
                      </>
                    ) : (
                      <>
                        <span className="text-xs text-[#33B8C8]">Confirm physical pickup</span>
                        <button
                          onClick={() => generatePin(activeChatMatch.id)}
                          className="tactile-btn h-9 px-3.5 rounded-xl bg-[#F8C12C] hover:brightness-95 text-[#0b4757] text-xs font-medium inline-flex items-center gap-1.5"
                        >
                          <Icon name="KeyRound" className="w-3.5 h-3.5" />
                          Generate PIN
                        </button>
                      </>
                    )}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-2.5 bg-white">
                  {activeChatMatch.messages.map((m, idx) => (
                    <div key={idx} className={`flex flex-col ${m.sender === 'owner' ? 'items-end' : m.sender === 'system' ? 'items-center' : 'items-start'}`}>
                      <div
                        className={`max-w-[85%] px-3.5 py-2 rounded-2xl text-xs leading-relaxed ${
                          m.sender === 'owner'
                            ? 'bg-[#33B8C8] text-white'
                            : m.sender === 'system'
                            ? 'bg-[#9CE5EC]/20 border border-[#9CE5EC] text-[#33B8C8] text-center'
                            : 'bg-[#9CE5EC]/20 border border-[#9CE5EC] text-[#0b4757]'
                        }`}
                      >
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={sendChat} className="p-4 border-t border-[#9CE5EC] flex items-center gap-2">
                  <input
                    type="text"
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    placeholder="Message campus desk..."
                    className="flex-1 h-10 px-3.5 rounded-xl border border-[#9CE5EC] bg-[#9CE5EC]/20 text-xs outline-none focus:border-[#33B8C8]"
                  />
                  <button
                    type="submit"
                    className="tactile-btn h-10 px-4 rounded-xl bg-[#33B8C8] text-white text-xs font-medium inline-flex items-center gap-1.5"
                  >
                    <Icon name="Send" className="w-3.5 h-3.5" />
                    Send
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* SUBTLE TOAST */}
          {toast && (
            <div className="pointer-events-none fixed top-20 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-full bg-[#33B8C8] text-white text-xs font-medium border border-[#0b4757] shadow-lg animate-modal-in">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CognifyApp />);
  </script>

  <!-- Botpress Webchat Assistant -->
  <link rel="stylesheet" href="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.css" />
  <script src="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.js"></script>
  <script>
    fetch("https://vdk-viber-runtime-prod.bot.botpress.host/edge/bots/0fbeb6d8-4ae4-42dd-983f-6a6b51a22714/config")
      .then((res) => res.json())
      .then(({ webchat }) =>
        VdkEdgeWebchat.mount({
          ...webchat,
          mode: "bubble",
          baseUrl: "https://vdk-viber-runtime-prod.bot.botpress.host",
          botId: "0fbeb6d8-4ae4-42dd-983f-6a6b51a22714"
        })
      )
      .catch((err) => console.warn("Botpress webchat failed to load:", err));
  </script>
</body>
</html>
