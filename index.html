    /* Ultra-subtle Hero Dot Grid */

      background-color: #FFFFFF;
      background-image: radial-gradient(#9CE5EC 1px, transparent 1px);

    /* Subtle Concentric Radar Pulse */
    @keyframes ping-subtle {
      0% { transform: scale(0.85); opacity: 0.75; }
      75% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-subtle {
      animation: ping-subtle 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    /* AI Reticle Laser Sweep */
    @keyframes reticle-sweep {
      0% { top: 8%; opacity: 0.85; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.85; }
    }
    .animate-reticle-sweep {
      animation: reticle-sweep 1.2s ease-in-out infinite;
    }

    /* Liquid Glass UI for All Standard Buttons (preserving LiquidMetalButton separately) */
    .tactile-btn,
    .liquid-glass-btn {
      position: relative;
      isolation: isolate;
      backdrop-filter: url("#container-glass") blur(10px) saturate(145%);
      -webkit-backdrop-filter: blur(10px) saturate(145%);
      background-image: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.44) 0%,
        rgba(255, 255, 255, 0.14) 46%,
        rgba(255, 255, 255, 0.03) 56%,
        rgba(255, 255, 255, 0.22) 100%
      );
      box-shadow:
        0 2px 8px rgba(11, 71, 87, 0.10),
        0 0 12px rgba(255, 255, 255, 0.28),
        inset 3px 3px 0.5px -3px rgba(11, 71, 87, 0.42),
        inset -3px -3px 0.5px -3px rgba(11, 71, 87, 0.35),

        inset 0 0 2px 2px rgba(255, 255, 255, 0.22);
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 220ms ease, filter 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }
    .tactile-btn:hover,
    .liquid-glass-btn:hover {
      transform: translateY(-1px) scale(1.02);

        inset 0 0 8px 5px rgba(255, 255, 255, 0.25),
        inset 0 0 2px 2px rgba(255, 255, 255, 0.32);

    .tactile-btn:active,
    .liquid-glass-btn:active {
      transform: scale(0.97);
    }

     * Adapted & scoped for Cognify Campus Finder card representation

    .finder-card {
      background-color: #FFFFFF;
      border: 1px solid #9CE5EC;
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), border-color 220ms ease, background-color 220ms ease;
    }
    .finder-card:hover {
      transform: translateY(-3px);
      border-color: #33B8C8;
      background-color: #F3FCFD;
    }
    .uiverse-noselect {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .uiverse-tilt-container {
      position: relative;
      width: 100%;
      height: 100%;
      transition: 200ms;
    }
    .uiverse-tilt-container:active {
      transform: scale(0.975);
    }
    .uiverse-tilt-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 800px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr 1fr 1fr 1fr 88px;
      gap: 0;
      grid-template-areas:
        "uiverse-tr-1 uiverse-tr-2 uiverse-tr-3 uiverse-tr-4 uiverse-tr-5"
        "uiverse-tr-6 uiverse-tr-7 uiverse-tr-8 uiverse-tr-9 uiverse-tr-10"
        "uiverse-tr-11 uiverse-tr-12 uiverse-tr-13 uiverse-tr-14 uiverse-tr-15"
        "uiverse-tr-16 uiverse-tr-17 uiverse-tr-18 uiverse-tr-19 uiverse-tr-20"
        "uiverse-tr-21 uiverse-tr-22 uiverse-tr-23 uiverse-tr-24 uiverse-tr-25";
    }
    .uiverse-tilt-card {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      position: relative;
      z-index: 0;
      border-radius: 20px;
      transition: 700ms;
      padding: 1.5px;
      background: linear-gradient(135deg, #0b4757 0%, #33B8C8 50%, #F8C12C 100%);
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
    }
    .uiverse-tilt-card::before {
      content: '';
      background: linear-gradient(43deg, #0b4757 0%, #33B8C8 46%, #F8C12C 100%);
      filter: blur(1.4rem);
      opacity: 0.22;
      inset: 4px;
      position: absolute;
      border-radius: 20px;
      z-index: -1;
      transition: 200ms;
      pointer-events: none;
    }
    .uiverse-tilt-container:hover .uiverse-tilt-card::before {
      opacity: 0.65;
    }
    .uiverse-tilt-card-inner {
      border-radius: 18.5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(243, 252, 253, 0.96) 100%);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .uiverse-card-prompt {
      transition: 300ms ease-in-out;
      opacity: 0.95;
    }
    .uiverse-card-title {
      opacity: 0;
      transition: opacity 300ms ease-in-out 100ms;
    }
    .uiverse-tracker {
      position: relative;
      z-index: 200;
      width: 100%;
      height: 100%;
    }
    .uiverse-tracker:hover {
      cursor: pointer;
    }
    .uiverse-tracker:hover ~ .uiverse-tilt-card {
      transition: 300ms;
      filter: brightness(1.04);
    }
    .uiverse-tracker:hover ~ .uiverse-tilt-card .uiverse-card-prompt {
      opacity: 0;
    }
    .uiverse-tracker:hover ~ .uiverse-tilt-card .uiverse-card-title {
      opacity: 1;
    }
    .uiverse-card-actions {
      position: relative;
      z-index: 250;
    }

    .uiverse-tr-10:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(7deg) rotateY(8deg) rotateZ(0deg); }

    .uiverse-tr-14:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(0deg) rotateY(4deg) rotateZ(0deg); }
    .uiverse-tr-15:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(0deg) rotateY(8deg) rotateZ(0deg); }
    .uiverse-tr-16:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(-7deg) rotateY(-8deg) rotateZ(0deg); }
    .uiverse-tr-17:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(-7deg) rotateY(-4deg) rotateZ(0deg); }
    .uiverse-tr-18:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(-7deg) rotateY(0deg) rotateZ(0deg); }
    .uiverse-tr-19:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(-7deg) rotateY(4deg) rotateZ(0deg); }
    .uiverse-tr-20:hover ~ .uiverse-tilt-card { transition: 125ms ease-in-out; transform: rotateX(-7deg) rotateY(8deg) rotateZ(0deg); }

    /* Slide-over Drawer Entrance */
    @keyframes drawer-in {
      from { transform: translateX(32px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-drawer-in {
      animation: drawer-in 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes modal-in {
      from { transform: scale(0.97) translateY(6px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-modal-in {
      animation: modal-in 200ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes bubble-float {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      15% { transform: translate(-50%, -25px) scale(1); opacity: 1; }
      80% { transform: translate(-50%, -125px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -155px) scale(1.12); opacity: 0; }
    }
    .animate-bubble-float {
      animation: bubble-float 2.1s cubic-bezier(0.3, 0.1, 0.4, 1) forwards;
    }

    .shader-container-exploded canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      border-radius: 100px !important;
    }
    @keyframes ripple-animation {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.65;
      }
      100% {
        transform: translate(-50%, -50%) scale(4);
        opacity: 0;
      }
    }

    @keyframes fade-in-down {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-down {
      animation: fade-in-down 0.8s ease-out forwards;

    .animate-fade-in-up {
      animation: fade-in-up 0.8s ease-out forwards;
      opacity: 0;
    }
    .animation-delay-200 { animation-delay: 0.2s; }
    .animation-delay-400 { animation-delay: 0.4s; }
    .animation-delay-600 { animation-delay: 0.6s; }
    .animation-delay-800 { animation-delay: 0.8s; }

      if (children && children.length > 0 && children.every((c) => Array.isArray(c) && typeof c[0] === 'string' && c[1])) {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth={strokeWidth}
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            aria-hidden="true"
          >
            {children.map((child, idx) => React.createElement(child[0], { ...child[1], key: idx }))}
          </svg>
        );
      }
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
          dangerouslySetInnerHTML={{ __html: ICON_PATHS[name] || ICON_PATHS.Compass }}
        />
      );
    }

    /* =========================================================
       21ST.DEV INTEGRATED COMPONENT: AQUARIUM PROMPT (Pixel-Art AI Concierge)
       ========================================================= */
    const AQ_PX = 4;
    const aqClamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const AQ_BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => v / 16 - 0.5);
    const AQ_SPECIES = [
      { body: [255, 128, 34], belly: [255, 170, 80], fin: [214, 82, 16], stripe: [255, 255, 255], len: 13, tall: 0.5, school: 3, speed: 1 },
      { body: [36, 92, 220], belly: [70, 140, 240], fin: [255, 214, 40], len: 14, tall: 0.55, school: 4, speed: 1.05 },
      { body: [255, 214, 32], belly: [255, 236, 110], fin: [240, 180, 0], len: 10, tall: 0.62, school: 4, speed: 1.1 },
      { body: [170, 206, 228], belly: [222, 240, 250], fin: [120, 160, 190], len: 7, tall: 0.38, school: 10, speed: 1.35 },
    ];

    function spawnAquariumFish(n, W, H) {
      const out = [];
      let s = 0;
      while (out.length < n) {
        const sp = AQ_SPECIES[s % AQ_SPECIES.length];
        const cx = 40 + Math.random() * Math.max(80, W - 80);
        const cy = 40 + Math.random() * Math.max(60, H - 90);
        const dir = Math.random() < 0.5 ? -1 : 1;
        for (let k = 0; k < sp.school && out.length < n; k++) {
          out.push({
            x: cx + (Math.random() - 0.5) * 60,
            y: cy + (Math.random() - 0.5) * 40,
            vx: dir * (0.6 + Math.random() * 0.5),
            vy: (Math.random() - 0.5) * 0.3,
            s: s % AQ_SPECIES.length,
            size: 0.85 + Math.random() * 0.3,
            phase: Math.random() * 6.28,
            dart: 0,
            gone: 0,
          });
        }
        s++;
      }
      return out;
    }

    function paintAquariumFish(buf, w, h, f) {
      const sp = AQ_SPECIES[f.s];
      const L = sp.len * f.size;
      const T = L * sp.tall;
      const cx = f.x / AQ_PX;
      const cy = f.y / AQ_PX;
      const facing = f.vx >= 0 ? 1 : -1;
      const tilt = aqClamp(Math.atan2(f.vy, Math.abs(f.vx) + 0.001), -0.6, 0.6) * facing;
      const ca = Math.cos(-tilt);
      const sa = Math.sin(-tilt);
      const wag = Math.sin(f.phase) * 0.35;
      const R = Math.ceil(L * 0.75);
      const alpha = 1 - f.gone;
      if (alpha <= 0.02) return;
      for (let py = Math.floor(cy - R); py <= cy + R; py++) {
        if (py < 0 || py >= h) continue;
        for (let px = Math.floor(cx - R); px <= cx + R; px++) {
          if (px < 0 || px >= w) continue;
          const dx = (px + 0.5 - cx) * facing;
          const dy = py + 0.5 - cy;
          const u = dx * ca - dy * sa * facing;
          const v = dx * sa * facing + dy * ca;
          let col = null;
          const bu = u / (L * 0.5);
          const bv = v / (T * 0.5);
          if (bu * bu + bv * bv <= 1) {
            col = v > T * 0.12 ? sp.belly : v < -T * 0.22 ? sp.fin : sp.body;
            if (sp.stripe && (Math.abs(u - L * 0.12) < 0.9 || Math.abs(u + L * 0.18) < 0.8)) col = sp.stripe;
            if (Math.abs(u - L * 0.3) < 0.75 && Math.abs(v + T * 0.08) < 0.75) col = [18, 22, 30];
          } else {
            const tu = -u - L * 0.42;
            const tv = v - wag * tu;
            if (tu > 0 && tu < L * 0.32 && Math.abs(tv) < tu * 0.95 + 0.4) col = sp.fin;
            else if (u > -L * 0.15 && u < L * 0.15 && v < -T * 0.45 && v > -T * 0.45 - (L * 0.15 - Math.abs(u)) * 0.9) col = sp.fin;
          }
          if (!col) continue;
          const i = (py * w + px) * 4;
          buf[i] = buf[i] + (col[0] - buf[i]) * alpha;
          buf[i + 1] = buf[i + 1] + (col[1] - buf[i + 1]) * alpha;
          buf[i + 2] = buf[i + 2] + (col[2] - buf[i + 2]) * alpha;
        }
      }
    }

    function AquariumPrompt({
      title = "What's on your mind?",
      placeholder = 'Ask anything',
      onSubmit,
      onInputChange,
      fish = 24,
      className = '',
    }) {
      const rootRef = useRef(null);
      const canvasRef = useRef(null);
      const inputRef = useRef(null);
      const formRef = useRef(null);
      const sendRef = useRef(null);
      const [text, setText] = useState('');
      const [sent, setSent] = useState(null);
      const labelId = useId();

      const world = useRef({
        fish: [],
        bubbles: [],
        ripples: [],
        ptr: { x: -999, y: -999, on: false, t: 0 },
        caret: { x: 0, y: 0, t: -99 },
        gulp: { x: 0, y: 0, t: -99 },
        W: 0,
        H: 0,
      });

      const typed = useCallback(() => {
        const inp = inputRef.current;
        const root = rootRef.current;
        if (!inp || !root) return;
        const r = inp.getBoundingClientRect();
        const b = root.getBoundingClientRect();
        const x = r.left - b.left + Math.min(r.width * 0.6, 24 + inp.value.length * 8);
        const y = r.top - b.top + r.height / 2;
        const w = world.current;
        w.caret = { x, y, t: performance.now() };
        w.bubbles.push({ x: x + (Math.random() - 0.5) * 6, y: y - 10, r: 1 + Math.round(Math.random()), v: 0.5 + Math.random() * 0.4, wob: Math.random() * 6 });
      }, []);

      useEffect(() => {
        const cv = canvasRef.current;
        const root = rootRef.current;
        if (!cv || !root) return;
        const ctx = cv.getContext('2d');
        const low = document.createElement('canvas');
        const lctx = low.getContext('2d', { willReadFrequently: true });
        let img = null;
        const w = world.current;

        const size = () => {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          w.W = root.clientWidth;
          w.H = root.clientHeight;
          if (!w.W || !w.H) return;
          cv.width = Math.round(w.W * dpr);
          cv.height = Math.round(w.H * dpr);
          low.width = Math.ceil(w.W / AQ_PX);
          low.height = Math.ceil(w.H / AQ_PX);
          img = lctx.createImageData(low.width, low.height);
          if (!w.fish.length) w.fish = spawnAquariumFish(fish, w.W, w.H);
        };
        size();
        const ro = new ResizeObserver(size);
        ro.observe(root);

        let raf = 0;
        let last = performance.now();
        const t0 = last;

        const step = (dt, now) => {
          const { fish: list, ptr, caret, gulp, W, H } = w;
          if (!W || !H) return;
          const typing = now - caret.t < 1600;
          const gulping = now - gulp.t < 1400;
          const k = dt * 60;
          for (let i = 0; i < list.length; i++) {
            const f = list[i];
            const sp = AQ_SPECIES[f.s];
            let ax = 0, ay = 0, cx = 0, cy = 0, avx = 0, avy = 0, n = 0;
            for (let j = 0; j < list.length; j++) {
              if (i === j) continue;
              const o = list[j];
              const dx = o.x - f.x;
              const dy = o.y - f.y;
              const d2 = dx * dx + dy * dy;
              const minD = (sp.len + AQ_SPECIES[o.s].len) * AQ_PX * 0.56;
              if (d2 < minD * minD && d2 > 0.01) {
                const d = Math.sqrt(d2);
                ax -= (dx / d) * (minD - d) * 0.012;
                ay -= (dy / d) * (minD - d) * 0.012;
              }
              if (o.s === f.s && d2 < 4900) {
                cx += o.x; cy += o.y; avx += o.vx; avy += o.vy; n++;
              }
            }
            if (n) {
              ax += (cx / n - f.x) * 0.0005 + (avx / n - f.vx) * 0.022;
              ay += (cy / n - f.y) * 0.0005 + (avy / n - f.vy) * 0.022;
            }
            const ts = now / 1000;
            const hx = W * (0.5 + 0.38 * Math.sin(ts * 0.07 + f.s * 1.9));
            const hy = H * (0.46 + 0.28 * Math.cos(ts * 0.09 + f.s * 2.7));
            ax += (hx - f.x) * 0.00035;
            ay += (hy - f.y) * 0.00035;
            f.phase += (0.18 + Math.hypot(f.vx, f.vy) * 0.12) * k;
            ax += Math.sin(now * 0.0007 + i * 1.7) * 0.012;
            ay += Math.cos(now * 0.0009 + i * 2.3) * 0.008;
            const m = 36;
            if (f.x < m) ax += (m - f.x) * 0.006;
            if (f.x > W - m) ax -= (f.x - (W - m)) * 0.006;
            if (f.y < m) ay += (m - f.y) * 0.006;
            if (f.y > H - m - 30) ay -= (f.y - (H - m - 30)) * 0.008;
            if (ptr.on && !gulping) {
              const dx = f.x - ptr.x;
              const dy = f.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 110 && d > 0.1) {
                const p = (110 - d) / 110;
                ax += (dx / d) * p * 0.6;
                ay += (dy / d) * p * 0.6;
                f.dart = Math.max(f.dart, p);
              }
            }
            for (const r of w.ripples) {
              const age = (now - r.t0) / 1000;
              if (age > 0.6) continue;
              const dx = f.x - r.x;
              const dy = f.y - r.y;
              const d = Math.hypot(dx, dy) || 1;
              if (d < 160) {
                ax += (dx / d) * 0.5 * (1 - d / 160);
                ay += (dy / d) * 0.5 * (1 - d / 160);
                f.dart = 1;
              }
            }
            if (typing && !gulping) {
              const dx = caret.x - f.x;
              const dy = caret.y - f.y;
              const d = Math.hypot(dx, dy) || 1;
              const want = 46 + (i % 5) * 9;
              const pull = (d - want) * 0.0016 * (1 - (now - caret.t) / 1600);
              ax += (dx / d) * pull;
              ay += (dy / d) * pull;
            }
            if (gulping) {
              const dx = gulp.x - f.x;
              const dy = gulp.y - f.y;
              const d = Math.hypot(dx, dy) || 1;
              ax += (dx / d) * 0.32;
              ay += (dy / d) * 0.32;
              if (d < 26) f.gone = Math.min(1, f.gone + 0.12 * k);
            } else if (f.gone > 0) {
              f.gone = Math.max(0, f.gone - 0.03 * k);
              if (f.gone > 0.9) {
                f.x = Math.random() < 0.5 ? -20 : W + 20;
                f.y = 40 + Math.random() * Math.max(40, H - 120);
                f.vx = f.x < 0 ? 1 : -1;
              }
            }
            f.dart = Math.max(0, f.dart - 0.02 * k);
            const maxV = 1.25 * sp.speed * (1 + f.dart * 2.2 + (gulping ? 1.6 : 0));
            f.vx += ax * k;
            f.vy += ay * k;
            const v = Math.hypot(f.vx, f.vy);
            const minV = 0.35 * sp.speed;
            if (v > maxV) { f.vx *= maxV / v; f.vy *= maxV / v; }
            else if (v < minV) { f.vx *= minV / Math.max(v, 0.01); f.vy *= minV / Math.max(v, 0.01); }
            f.vy *= 0.985;
            f.x += f.vx * k;
            f.y += f.vy * k;
          }
          if (Math.random() < 0.04 * k) {
            w.bubbles.push({ x: W * (0.08 + Math.random() * 0.84), y: H - 20, r: 1 + Math.round(Math.random()), v: 0.35 + Math.random() * 0.4, wob: Math.random() * 6 });
          }
          w.bubbles = w.bubbles.filter((b) => { b.y -= b.v * k; b.wob += 0.08 * k; return b.y > -10; });
          w.ripples = w.ripples.filter((r) => now - r.t0 < 1200);
        };

        const draw = (now) => {
          if (!img || !w.W || !w.H) return;
          const lw = low.width;
          const lh = low.height;
          const d = img.data;
          const t = (now - t0) / 1000;
          for (let y = 0; y < lh; y++) {
            const gy = y / lh;
            for (let x = 0; x < lw; x++) {
              const i = (y * lw + x) * 4;
              const c1 = Math.sin(x * 0.21 + t * 0.9 + Math.sin(y * 0.17 + t * 0.6) * 1.6) + Math.sin(y * 0.19 - t * 0.7 + Math.sin(x * 0.13 - t * 0.5) * 1.4);
              const caustic = c1 > 1.25 ? 1 - gy * 0.7 : 0;
              const rays = Math.max(0, Math.sin((x - y * 0.55) * 0.09 + t * 0.15)) ** 6 * (1 - gy) * 0.5;
              const dither = AQ_BAYER[(y & 3) * 4 + (x & 3)] * 0.09;
              const g = aqClamp(gy + dither);
              const level = Math.round(g * 6) / 6;
              let r = 168 - 120 * level;
              let gg = 236 - 62 * level;
              let b = 242 - 46 * level;
              const glow = caustic * 0.22 + rays * 0.35;
              r += (255 - r) * glow;
              gg += (255 - gg) * glow;
              b += (255 - b) * glow;
              d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
            }
          }
          const sandTop = lh - 6;
          for (let y = sandTop; y < lh; y++) {
            for (let x = 0; x < lw; x++) {
              const i = (y * lw + x) * 4;
              const bump = Math.sin(x * 0.3) * 0.8 + Math.sin(x * 0.11) * 1.4;
              if (y < sandTop + 2 + bump) continue;
              const shade = ((x * 7 + y * 13) % 5 === 0 ? 18 : 0) + (y - sandTop) * 3;
              d[i] = 236 - shade; d[i + 1] = 214 - shade; d[i + 2] = 170 - shade;
            }
          }
          for (let s = 0; s < lw; s += 11) {
            const base = s + ((s * 7) % 5);
            const tall = 8 + ((s * 13) % 9);
            for (let k = 0; k < tall; k++) {
              const x = Math.round(base + Math.sin(t * 1.3 + s + k * 0.35) * (k * 0.12));
              const y = sandTop - k + 2;
              if (x < 0 || x >= lw || y < 0) continue;
              const i = (y * lw + x) * 4;
              const dark = k % 3 === 0;
              d[i] = dark ? 34 : 52; d[i + 1] = dark ? 130 : 160; d[i + 2] = dark ? 96 : 110;
            }
          }
          for (const b of w.bubbles) {
            const bx = Math.round((b.x + Math.sin(b.wob) * 3) / AQ_PX);
            const by = Math.round(b.y / AQ_PX);
            for (let yy = -b.r; yy <= b.r; yy++) {
              for (let xx = -b.r; xx <= b.r; xx++) {
                const x = bx + xx, y = by + yy;
                if (x < 0 || y < 0 || x >= lw || y >= lh) continue;
                const r2 = xx * xx + yy * yy;
                if (r2 > b.r * b.r + 0.5) continue;
                const i = (y * lw + x) * 4;
                const rim = r2 >= b.r * b.r - 0.5 || b.r === 1;
                const k = rim ? 0.75 : 0.25;
                d[i] += (255 - d[i]) * k; d[i + 1] += (255 - d[i + 1]) * k; d[i + 2] += (255 - d[i + 2]) * k;
              }
            }
          }
          for (const r of w.ripples) {
            const age = (now - r.t0) / 1000;
            const rad = (age * 140) / AQ_PX;
            const a = 0.6 * (1 - age / 1.2);
            const cx = r.x / AQ_PX, cy = r.y / AQ_PX;
            const steps = Math.max(12, Math.round(rad * 6));
            for (let s = 0; s < steps; s++) {
              const ang = (s / steps) * Math.PI * 2;
              const x = Math.round(cx + Math.cos(ang) * rad);
              const y = Math.round(cy + Math.sin(ang) * rad * 0.8);
              if (x < 0 || y < 0 || x >= lw || y >= lh) continue;
              const i = (y * lw + x) * 4;
              d[i] += (255 - d[i]) * a; d[i + 1] += (255 - d[i + 1]) * a; d[i + 2] += (255 - d[i + 2]) * a;
            }
          }
          for (const f of w.fish) paintAquariumFish(d, lw, lh, f);
          lctx.putImageData(img, 0, 0);
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, cv.width, cv.height);
          ctx.drawImage(low, 0, 0, lw * AQ_PX * (cv.width / w.W), lh * AQ_PX * (cv.height / w.H));
        };

        const frame = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (!document.hidden) {
            step(dt, now);
            draw(now);
          }
          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
        return () => { cancelAnimationFrame(raf); ro.disconnect(); };
      }, [fish]);

      const send = (e) => {
        e.preventDefault();
        const v = text.trim();
        if (!v) return;
        const b = rootRef.current.getBoundingClientRect();
        const r = (sendRef.current || inputRef.current).getBoundingClientRect();
        const fr = formRef.current.getBoundingClientRect();
        world.current.gulp = { x: (fr.left + fr.right) / 2 - b.left, y: r.top + r.height / 2 - b.top, t: performance.now() };
        setSent({ id: Date.now(), text: v });
        setText('');
        if (onSubmit) onSubmit(v);
      };

      useEffect(() => {
        if (!sent) return;
        const t = setTimeout(() => setSent(null), 2200);
        return () => clearTimeout(t);
      }, [sent]);

      return (
        <div
          ref={rootRef}
          onPointerMove={(e) => {
            const b = rootRef.current.getBoundingClientRect();
            Object.assign(world.current.ptr, { x: e.clientX - b.left, y: e.clientY - b.top, on: true, t: performance.now() });
          }}
          onPointerLeave={() => { world.current.ptr.on = false; }}
          onPointerDown={(e) => {
            if (formRef.current && formRef.current.contains(e.target)) return;
            const b = rootRef.current.getBoundingClientRect();
            world.current.ripples.push({ x: e.clientX - b.left, y: e.clientY - b.top, t0: performance.now() });
          }}
          className={`relative h-[380px] sm:h-[420px] w-full select-none overflow-hidden rounded-2xl bg-[#7fd3e3] border border-[#D5ECEF] ${className}`}
        >
          <canvas ref={canvasRef} aria-hidden="true" className="absolute inset-0 h-full w-full [image-rendering:pixelated]" />
          <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center px-5">
            <h3 id={labelId} className="m-0 text-center font-display text-2xl sm:text-3xl font-semibold tracking-tight text-[#0b4757]">
              {title}
            </h3>
            <form
              ref={formRef}
              onSubmit={send}
              className="pointer-events-auto relative mt-5 flex w-full max-w-[520px] items-center gap-2 rounded-2xl border border-white/70 bg-white/60 p-1.5 pl-4 backdrop-blur-xl"
            >
              <input
                ref={inputRef}
                value={text}
                onChange={(e) => {
                  setText(e.target.value);
                  if (onInputChange) onInputChange(e.target.value);
                  requestAnimationFrame(typed);
                }}
                onClick={typed}
                placeholder={placeholder}
                aria-labelledby={labelId}
                className="h-10 min-w-0 flex-1 bg-transparent text-sm sm:text-base text-[#06303b] outline-none placeholder:text-[#2c6878]/75"
              />
              <button
                ref={sendRef}
                type="submit"
                disabled={!text.trim()}
                aria-label="Send"
                className={`tactile-btn grid h-9 w-9 shrink-0 place-items-center rounded-full text-white ${
                  text.trim() ? 'bg-[#0b4757] cursor-pointer' : 'bg-[#0b4757]/30 cursor-not-allowed'
                }`}
              >
                <Icon name="ArrowUp" className="w-4 h-4" />
              </button>
              {sent && (
                <div
                  key={sent.id}
                  aria-live="polite"
                  className="animate-bubble-float pointer-events-none absolute left-1/2 top-0 max-w-[80%] truncate rounded-full border border-white/80 bg-white/60 px-4 py-1.5 text-xs font-medium text-[#06303b] backdrop-blur-md"
                >
                  {sent.text}
                </div>
              )}
            </form>
            <p className="m-0 mt-3 px-3 py-1 rounded-full bg-white/60 backdrop-blur-sm text-xs font-medium text-[#06303b]">
              Move through the water, tap to ripple, or search Cognify campus reports above.
            </p>
          </div>
        </div>
      );
    }

    /* =========================================================
       21ST.DEV INTEGRATED COMPONENT: LIQUID METAL BUTTON
       (3D preserve-3d layers + liquid shader canvas + ripples)
       ========================================================= */
    function LiquidMetalButton({
      label = 'Get Started',
      onClick,
      viewMode = 'text',
      width = 176,
      accent = 'dark', // 'dark' | 'orange'
    }) {
      const [isHovered, setIsHovered] = useState(false);
      const [isPressed, setIsPressed] = useState(false);
      const [ripples, setRipples] = useState([]);
      const shaderRef = useRef(null);
      const speedRef = useRef(0.6);
      const buttonRef = useRef(null);
      const rippleId = useRef(0);

      const dims = useMemo(() => {
        if (viewMode === 'icon') {
          return { width: 46, height: 46, innerWidth: 42, innerHeight: 42 };
        }
        return { width, height: 46, innerWidth: width - 4, innerHeight: 42 };
      }, [viewMode, width]);

      // Smooth animated metallic shader canvas inside shaderRef
      useEffect(() => {
        const container = shaderRef.current;
        if (!container) return;
        const canvas = document.createElement('canvas');
        canvas.width = dims.width * 2;

    const ORB_VERT = `

        float g = fbm(q * 4.6 - vec2(t * 0.2, 0.0));

    function LiveOrb({ size = 104 }) {

        const uLook = gl.getUniformLocation(prog, 'u_look');
        const uBlink = gl.getUniformLocation(prog, 'u_blink');
        const uEye = gl.getUniformLocation(prog, 'u_eye');
        const uC1 = gl.getUniformLocation(prog, 'u_c1');
        const uC2 = gl.getUniformLocation(prog, 'u_c2');
        const uC3 = gl.getUniformLocation(prog, 'u_c3');

        const target = { x: 0, y: 0.08 };

        let nextBlink = 2000;

          const dy = (rect.top + rect.height / 2 - e.clientY) / (rect.height / 2);

            glance.x = back ? 0 : (Math.random() * 2 - 1) * 0.8;
            glance.y = back ? 0.08 : (Math.random() * 2 - 1) * 0.5;
            nextGlance = clock + 1100 + Math.random() * 1900;
          }
          const goal = steering ? target : glance;
          const ease = steering ? 0.16 : 0.1;
          look.x += (goal.x - look.x) * ease;
          look.y += (goal.y - look.y) * ease;
          if (clock >= nextBlink) {
            blinkAt = clock;
            nextBlink = clock + 2400 + Math.random() * 3400;

          cancelAnimationFrame(raf);
          window.removeEventListener('pointermove', onMove);

        const vsSrc = `#version 300 es\nprecision highp float;\nin vec4 position;\nvoid main(){gl_Position=position;}`;
        const compileShader = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;

        if (!vs || !fs) return;

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 1, -1, -1, 1, 1, 1, -1]), gl.STATIC_DRAW);
        const pos = gl.getAttribLocation(prog, 'position');
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(prog, 'resolution');
        const uTime = gl.getUniformLocation(prog, 'time');

          const dpr = Math.max(1, 0.5 * (window.devicePixelRatio || 1));
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          gl.viewport(0, 0, canvas.width, canvas.height);
        };
        resize();
        window.addEventListener('resize', resize);

        let raf = 0;
        const render = (now) => {
          gl.clearColor(0.200, 0.722, 0.784, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(prog);
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, now * 1e-3);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          raf = requestAnimationFrame(render);

        raf = requestAnimationFrame(render);

          cancelAnimationFrame(raf);

    function tokenizeItemText(text) {
      const raw = String(text || '')
        .toLowerCase()
        .replace(/(electronics|accessories|wallets|documents|clothing|library|cafeteria|auditorium|sports|hostel|academic)/g, ' $1 ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
      return raw
        .split(/\s+/)
        .filter((w) => w.length >= 2 && !MATCH_STOPWORDS.has(w));
    }

    function extractConcepts(tokens, list) {
      const found = new Set();
      tokens.forEach((tok) => {
        list.forEach((group) => {
          if (group.words.some((w) => tok === w || (tok.length >= 4 && w.startsWith(tok)) || (w.length >= 4 && tok.startsWith(w)))) {
            found.add(group.key);
          }
        });
      });
      return found;
    }

    function tokensFuzzyEqual(t1, t2) {
      if (t1 === t2) return true;
      if (t1.length >= 4 && t2.length >= 4 && (t1.includes(t2) || t2.includes(t1))) return true;
      if (Math.abs(t1.length - t2.length) <= 1 && t1.length >= 4) {
        let diff = 0;
        const minL = Math.min(t1.length, t2.length);
        for (let i = 0; i < minL; i++) {
          if (t1[i] !== t2[i]) diff++;
        }
        diff += Math.abs(t1.length - t2.length);
        return diff <= 1;
      }
      return false;
    }

    function computeMatch(a, b) {
      const attributes = [];
      let score = 0;

      const textA = `${a.title || ''} ${a.brand || ''} ${a.color || ''} ${a.marks || ''} ${a.spot || ''}`;
      const textB = `${b.title || ''} ${b.brand || ''} ${b.color || ''} ${b.marks || ''} ${b.spot || ''}`;
      const tokA = Array.from(new Set(tokenizeItemText(textA)));
      const tokB = Array.from(new Set(tokenizeItemText(textB)));

      // 1. Object / device semantic concepts (up to 38 pts, or penalty on clear mismatch)
      const conceptsA = extractConcepts(tokA, OBJECT_CONCEPTS);
      const conceptsB = extractConcepts(tokB, OBJECT_CONCEPTS);
      const sharedConcepts = Array.from(conceptsA).filter((c) => conceptsB.has(c));
      if (sharedConcepts.length > 0) {
        score += 38;
        sharedConcepts.slice(0, 2).forEach((c) => attributes.push(c));
      } else if (conceptsA.size > 0 && conceptsB.size > 0) {
        score -= 26;
      }

      // 2. Campus zone & pickup spot overlap (up to 26 pts)
      const zoneA = (a.zone || '').trim().toLowerCase();
      const zoneB = (b.zone || '').trim().toLowerCase();
      if (zoneA && zoneB && zoneA === zoneB) {
        score += 22;
        attributes.push(b.zone || a.zone);
      } else if (zoneA && zoneB && (zoneA.includes(zoneB) || zoneB.includes(zoneA))) {
        score += 14;
        attributes.push(b.zone || a.zone);
      }
      const spotA = tokenizeItemText(a.spot || '');
      const spotB = tokenizeItemText(b.spot || '');
      if (spotA.some((sa) => spotB.some((sb) => tokensFuzzyEqual(sa, sb)))) {
        score += 4;
      }

      // 3. Category match (up to 14 pts)
      const catA = (a.category || '').trim().toLowerCase();
      const catB = (b.category || '').trim().toLowerCase();
      if (catA && catB && catA !== 'unspecified' && catA === catB) {
        score += 14;
        attributes.push(b.category || a.category);
      }

      // 4. Brand / model match (up to 14 pts)
      const brandA = (a.brand || '').trim().toLowerCase();
      const brandB = (b.brand || '').trim().toLowerCase();
      if (brandA && brandB && !MATCH_STOPWORDS.has(brandA) && !MATCH_STOPWORDS.has(brandB) && tokensFuzzyEqual(brandA, brandB)) {
        score += 14;
        attributes.push(b.brand);
      }

      // 5. Color & color-family match (up to 10 pts)
      const colorsA = extractConcepts(tokA, COLOR_GROUPS);
      const colorsB = extractConcepts(tokB, COLOR_GROUPS);
      const sharedColors = Array.from(colorsA).filter((c) => colorsB.has(c));
      if (sharedColors.length > 0) {
        score += 10;
        attributes.push(sharedColors[0]);
      }

      // 6. Direct / fuzzy keyword overlap across title + marks + spot (up to 18 pts)
      const matchedWords = [];
      tokA.forEach((ta) => {
        if (tokB.some((tb) => tokensFuzzyEqual(ta, tb))) {
          matchedWords.push(ta);
        }
      });
      if (matchedWords.length > 0) {
        score += Math.min(18, matchedWords.length * 7);
        matchedWords.slice(0, 2).forEach((w) => {
          const cap = w.charAt(0).toUpperCase() + w.slice(1);
          if (!attributes.some((ex) => ex.toLowerCase().includes(w))) attributes.push(cap);
        });
      }

      const finalScore = Math.max(0, Math.min(98, Math.round(score)));
      return {
        score: finalScore,
        attributes: Array.from(new Set(attributes)).slice(0, 4),
      };
    }

        return Array.from(new Set([
          `https://lh3.googleusercontent.com/d/${fid}=w800`,
          `https://drive.google.com/thumbnail?id=${fid}&sz=w800`,
          url,

      return [url];

    function CoverflowCarousel({
      slides,
      rotate = 44,
      depth = 0.6,
      perspective = 3,
      falloff = 0.56,
      fade = 0.1,
      cardWidth = "clamp(200px, 26vw, 290px)",
      gap = 0.08,
      loop = true,
      showCaption = true,
      showPagination = true,
      showNavigation = true,
      label = "Public Item Feed Carousel",
      className = "",
      onSlideAction,
    }) {
      const count = slides.length;
      const frameRef = useRef(null);
      const cardRefs = useRef([]);
      const posRef = useRef(0);
      const targetRef = useRef(0);
      const widthRef = useRef(0);
      const rafRef = useRef(null);
      const dragRef = useRef(null);
      const [selected, setSelected] = useState(0);

      const effectiveLoop = loop && count > 2;

      const indexAt = useCallback(
        (pos) => (count === 0 ? 0 : ((Math.round(pos) % count) + count) % count),
        [count]
      );

      const paint = useCallback(() => {
        const width = widthRef.current;
        if (!width || count === 0) return;
        const pitch = width * (1 + gap);
        const pos = posRef.current;

        cardRefs.current.slice(0, count).forEach((card, index) => {
          if (!card) return;
          let offset = index - pos;
          if (effectiveLoop) {
            offset = ((offset % count) + count) % count;
            if (offset > count / 2) offset -= count;
          }
          const distance = Math.abs(offset);
          const ramp = Math.pow(distance, falloff);
          const tilt = Math.min(rotate * ramp, 82) * Math.sign(offset);

          card.style.transform =
            `translateX(calc(-50% + ${offset * pitch}px)) ` +
            `translateZ(${-depth * width * ramp}px) rotateY(${-tilt}deg)`;

          const edge = effectiveLoop ? Math.min(1, Math.max(0, count / 2 - distance)) : 1;
          card.style.opacity = String(Math.max(0, 1 - fade * distance) * edge);
          card.style.zIndex = String(100 - Math.round(distance));
        });
      }, [count, depth, effectiveLoop, fade, falloff, gap, rotate]);

      const settle = useCallback(
        (target) => {
          if (count === 0) return;
          if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
          targetRef.current = target;
          setSelected(indexAt(target));

          const step = () => {
            const remaining = target - posRef.current;
            if (Math.abs(remaining) < 0.0004) {
              posRef.current = target;
              paint();
              rafRef.current = null;
              return;
            }
            posRef.current += remaining * 0.16;
            paint();
            rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        },
        [count, indexAt, paint]
      );

      const clamp = useCallback(
        (pos) => (effectiveLoop ? pos : Math.max(0, Math.min(Math.max(0, count - 1), pos))),
        [count, effectiveLoop]
      );

      const goTo = useCallback(
        (index) => {
          if (count === 0) return;
          const target = effectiveLoop
            ? index + Math.round((targetRef.current - index) / count) * count
            : index;
          settle(clamp(target));
        },
        [clamp, count, effectiveLoop, settle]
      );

      const nudge = useCallback(
        (by) => settle(clamp(Math.round(targetRef.current) + by)),
        [clamp, settle]
      );

      useEffect(() => {
        posRef.current = 0;
        targetRef.current = 0;
        setSelected(0);
        const timer = requestAnimationFrame(() => paint());
        return () => cancelAnimationFrame(timer);
      }, [count, paint]);

      const onPointerDown = (event) => {
        if (event.target.closest("button")) return;
        if (rafRef.current !== null) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = null;
        }
        event.currentTarget.setPointerCapture(event.pointerId);
        targetRef.current = posRef.current;
        dragRef.current = {
          id: event.pointerId,
          x: event.clientX,
          pos: posRef.current,
          v: 0,
          t: performance.now(),
        };
      };

      const onPointerMove = (event) => {
        const drag = dragRef.current;
        if (!drag || drag.id !== event.pointerId) return;
        const pitch = widthRef.current * (1 + gap);
        if (!pitch) return;
        const now = performance.now();
        const previous = posRef.current;
        posRef.current = clamp(drag.pos - (event.clientX - drag.x) / pitch);
        drag.v = ((posRef.current - previous) / Math.max(now - drag.t, 1)) * 1000;
        drag.t = now;
        const index = indexAt(posRef.current);
        if (index !== selected) setSelected(index);
        paint();
      };

      const endDrag = (event) => {
        const drag = dragRef.current;
        if (!drag || drag.id !== event.pointerId) return;
        dragRef.current = null;
        const carried = Math.max(-2, Math.min(2, drag.v * 0.18));
        settle(clamp(Math.round(posRef.current + carried)));
      };

      useEffect(() => {
        const frame = frameRef.current;
        if (!frame) return;
        const measure = () => {
          const card = cardRefs.current[0];
          if (!card) return;
          widthRef.current = card.offsetWidth;
          paint();
        };
        measure();
        const observer = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
        if (observer) observer.observe(frame);
        return () => observer && observer.disconnect();
      }, [paint]);

      useEffect(() => () => {
        if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
      }, []);

        <div
          className={`w-full ${className}`}
          style={{ "--cf-card": cardWidth }}
          role="region"
          aria-roledescription="carousel"
          aria-label={label}

            <div

              onPointerUp={endDrag}
              onPointerCancel={endDrag}
              onKeyDown={(event) => {

                    {slide.blurred && (

                          Privacy Protected

                        <p className="text-[11px] text-[#0b4757] font-medium mt-2">

                      </div>

                    {slide.item && (

              </div>
            </div>

            {showNavigation && count > 1 && (

                  aria-label="Previous slide"
                  onClick={() => nudge(-1)}
                  className="tactile-btn absolute left-2 sm:left-4 top-1/2 z-[200] -translate-y-1/2 rounded-full border border-[#9CE5EC] bg-white/85 p-2.5 text-[#0b4757] backdrop-blur shadow-md hover:bg-white cursor-pointer"

                  <Icon name="ChevronLeft" className="w-5 h-5" />

      const hashPassword = async (pwd) => {
        try {
          if (window.crypto && window.crypto.subtle) {
            const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
            return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (e) {}
        let h = 2166136261;
        for (let i = 0; i < pwd.length; i++) {
          h ^= pwd.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return `fnv_${(h >>> 0).toString(16)}`;
      };

      const openVerifyChallenge = (foundItem, existingMatch = null) => {
        const linked = existingMatch || matches.find((m) => m.foundId === foundItem.id);
        setVerifyTarget({ foundItem, matchId: linked ? linked.id : null });
        setVerifyInput('');
        setVerifyClaimantName(currentUser?.fullName || currentUser?.username || '');
        setVerifyClaimantEmail(currentUser?.email || '');
        setVerifyErr('');
        setShowHint(false);

        const itemKey = foundItem.rawId || foundItem.id;
        const userEmail = (currentUser?.email || '').toLowerCase();
        const existingUserClaim = userEmail
          ? claims.find((c) => c.item_id === itemKey && (c.claimant_email || '').toLowerCase() === userEmail)
          : null;
        setVerifySubmittedClaimId(existingUserClaim ? existingUserClaim.id : null);
      };

      const openHandoverChatForClaim = (claim) => {
        const foundItem = items.find((i) => i.rawId === claim.item_id || i.id === claim.item_id) || {
          id: (claim.item_display_id || claim.item_id || '').replace(/^#/, ''),
          title: claim.item_title || 'Found Item',
          zone: claim.item_zone || 'Campus Zone',
          spot: claim.item_zone || 'Campus Desk',
        };
        const existing = matches.find((m) => m.foundId === foundItem.id || m.claimId === claim.id);
        if (existing) {
          setMatches((prev) =>
            prev.map((m) =>
              m.id === existing.id
                ? {
                    ...m,
                    step: Math.max(m.step, 3),
                    handoverPin: claim.handover_pin || m.handoverPin,
                  }
                : m
            )
          );
          setActiveChatMatchId(existing.id);
        } else {
          const targetMId = `M-${Math.floor(110 + Math.random() * 880)}`;
          setMatches((prev) => [
            {
              id: targetMId,
              claimId: claim.id,
              lostId: foundItem.id,
              foundId: foundItem.id,
              score: 100,
              attributes: [foundItem.zone, 'Finder Verified'],
              step: 3,
              handoverPin: claim.handover_pin || null,
              messages: [
                {
                  sender: 'finder',
                  text: `Finder verified ${claim.claimant_name}'s answer ("${claim.answer}"). Handover PIN: ${claim.handover_pin || 'Pending'}.`,
                  time: 'Now',
                },
              ],
            },
            ...prev,
          ]);
          setActiveChatMatchId(targetMId);
        }
        setVerifyTarget(null);
      };

      const submitVerification = async (e) => {
        e.preventDefault();
        if (!verifyTarget) return;
        const { foundItem } = verifyTarget;
        const given = verifyInput.trim();
        const cName = verifyClaimantName.trim();
        const cEmail = verifyClaimantEmail.trim().toLowerCase();

        if (!cName) {
          setVerifyErr('Please enter your name so the finder knows who is claiming.');
          return;
        }
        if (!cEmail || !cEmail.includes('@')) {
          setVerifyErr('Please enter a valid email address to track approval.');
          return;
        }
        if (!given) {
          setVerifyErr('Please enter your ownership verification answer.');
          return;
        }

        const itemKey = foundItem.rawId || foundItem.id;
        const newClaim = {
          id: `CLM-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
          item_id: itemKey,
          item_display_id: `#${foundItem.id}`,
          item_title: foundItem.title,
          item_zone: foundItem.zone,
          finder_email: (foundItem.reporterEmail || '').toLowerCase(),
          claimant_name: cName,
          claimant_email: cEmail,
          answer: given,
          status: 'pending',
          handover_pin: null,
          created_at: new Date().toISOString(),
        };

        setVerifySubmitting(true);
        setVerifyErr('');
        let savedClaim = { ...newClaim, localOnly: true };
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/claims`, {
            method: 'POST',
            headers: {
              apikey: SUPABASE_PUBLISHABLE_KEY,
              'Content-Type': 'application/json',
              Prefer: 'return=representation',
            },
            body: JSON.stringify(newClaim),
          });
          if (res.ok) {
            const data = await res.json();
            savedClaim = Array.isArray(data) && data[0] ? data[0] : newClaim;
            notify(`Answer sent to the finder of #${foundItem.id} for review.`);
          } else {
            notify('Claim queued locally. Run the claims SQL in Supabase so the finder receives it online.');
          }
        } catch (err) {
          notify('Claim saved locally. Check Supabase connection for remote finder review.');
        } finally {
          setVerifySubmitting(false);
        }

        setClaims((prev) => [savedClaim, ...prev.filter((c) => c.id !== savedClaim.id)]);
        setVerifySubmittedClaimId(savedClaim.id);
        setVerifyInput('');
      };

      const approveClaim = async (claim) => {
        const pin = String(Math.floor(1000 + Math.random() * 9000));
        setClaims((prev) =>
          prev.map((c) => (c.id === claim.id ? { ...c, status: 'approved', handover_pin: pin } : c))
        );
        setItems((prev) =>
          prev.map((it) =>
            it.rawId === claim.item_id || it.id === claim.item_id ? { ...it, privacyUnlocked: true } : it
          )
        );

        try {
          await fetch(`${SUPABASE_URL}/rest/v1/claims?id=eq.${encodeURIComponent(claim.id)}`, {
            method: 'PATCH',
            headers: {
              apikey: SUPABASE_PUBLISHABLE_KEY,
              'Content-Type': 'application/json',
              Prefer: 'return=representation',
            },
            body: JSON.stringify({ status: 'approved', handover_pin: pin }),
          });
          if (claim.item_id) {
            await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${encodeURIComponent(claim.item_id)}`, {
              method: 'PATCH',
              headers: {
                apikey: SUPABASE_PUBLISHABLE_KEY,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ privacy_unlocked: true }),
            });
          }
        } catch (e) {}
        notify(`Approved claim from ${claim.claimant_name}! Handover PIN: ${pin}`);
      };

      const rejectClaim = async (claim) => {
        setClaims((prev) => prev.map((c) => (c.id === claim.id ? { ...c, status: 'rejected' } : c)));
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/claims?id=eq.${encodeURIComponent(claim.id)}`, {
            method: 'PATCH',
            headers: {
              apikey: SUPABASE_PUBLISHABLE_KEY,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ status: 'rejected' }),
          });
        } catch (e) {}
        notify(`Rejected claim from ${claim.claimant_name}.`);
      };

      const generatePin = (matchId) => {
        const pin = String(Math.floor(1000 + Math.random() * 9000));
        setMatches((prev) =>
          prev.map((m) =>
            m.id === matchId
              ? {
                  ...m,
                  handoverPin: pin,
                  messages: [...m.messages, { sender: 'system', text: `Handover PIN ${pin} generated for pickup verification.`, time: 'Now' }],
                }
              : m
          )
        );
        notify(`Generated 4-digit Handover PIN: ${pin}`);
      };

      const sendChat = (e) => {
        e.preventDefault();
        if (!chatDraft.trim() || !activeChatMatch) return;
        const txt = chatDraft.trim();
        const mId = activeChatMatch.id;
        setMatches((prev) =>
          prev.map((m) => (m.id === mId ? { ...m, messages: [...m.messages, { sender: 'owner', text: txt, time: 'Now' }] } : m))
        );
        setChatDraft('');
        setTimeout(() => {
          setMatches((prev) =>
            prev.map((m) =>
              m.id === mId
                ? { ...m, messages: [...m.messages, { sender: 'finder', text: 'Sounds good — the desk team has your tag ready.', time: 'Now' }] }
                : m
            )
          );
        }, 650);
      };

      const markReunited = async (matchId) => {
        const mObj = enrichedMatches.find((m) => m.id === matchId) || matches.find((m) => m.id === matchId);
        if (!mObj) return;
        const foundKey = mObj.foundItem?.rawId || mObj.foundId;
        const lostKey = mObj.lostItem?.rawId || mObj.lostId;
        setMatches((prev) => prev.map((m) => (m.id === matchId ? { ...m, step: 4 } : m)));
        setItems((prev) =>
          prev.map((it) =>
            it.id === mObj.foundId || it.id === mObj.lostId || it.rawId === foundKey || it.rawId === lostKey
              ? { ...it, status: 'Reunited', privacyUnlocked: true }
              : it
          )
        );
        setActiveChatMatchId(null);
        for (const k of [foundKey, lostKey].filter(Boolean)) {
          try {
            await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${encodeURIComponent(k)}`, {
              method: 'PATCH',
              headers: { apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: 'Reunited', privacy_unlocked: true }),
            });
          } catch (e) {}
        }
        notify(`Marked #${mObj.foundId} as Reunited.`);
      };

      /* =========================================================
         ADMIN ACTIONS
         ========================================================= */
      const adminApprove = async (id) => {
        const target = items.find((i) => i.id === id || i.rawId === id);
        const key = target?.rawId || id;
        setItems((prev) => prev.map((i) => (i.id === id || i.rawId === key ? { ...i, isFlagged: false, privacyUnlocked: true } : i)));
        setMatches((prev) => prev.map((m) => (m.foundId === id || m.lostId === id ? { ...m, step: Math.max(m.step, 3) } : m)));
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${encodeURIComponent(key)}`, {
            method: 'PATCH',
            headers: { apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_flagged: false, privacy_unlocked: true }),
          });
        } catch (e) {}
        notify(`Approved #${id}.`);
      };
      const adminFlag = async (id) => {
        const target = items.find((i) => i.id === id || i.rawId === id);
        const key = target?.rawId || id;
        const nextFlag = !target?.isFlagged;
        setItems((prev) => prev.map((i) => (i.id === id || i.rawId === key ? { ...i, isFlagged: nextFlag } : i)));
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${encodeURIComponent(key)}`, {
            method: 'PATCH',
            headers: { apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_flagged: nextFlag }),
          });
        } catch (e) {}
        notify(`Updated flag status for #${id}.`);
      };
      const adminReunite = async (id) => {
        const target = items.find((i) => i.id === id || i.rawId === id);
        const key = target?.rawId || id;
        setItems((prev) => prev.map((i) => (i.id === id || i.rawId === key ? { ...i, status: 'Reunited', isFlagged: false, privacyUnlocked: true } : i)));
        setMatches((prev) => prev.map((m) => (m.foundId === id || m.lostId === id ? { ...m, step: 4 } : m)));
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${encodeURIComponent(key)}`, {
            method: 'PATCH',
            headers: { apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'Reunited', is_flagged: false, privacy_unlocked: true }),
          });
        } catch (e) {}
        notify(`Marked #${id} Reunited.`);
      };

      const unreadCount = notifications.filter((n) => n.unread).length;

      return (
        <div className="min-h-screen flex flex-col bg-white text-[#0b4757]">

                <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence" />
                <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
                <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="38" xChannelSelector="R" yChannelSelector="B" result="displaced" />
                <feGaussianBlur in="displaced" stdDeviation="2.5" result="finalBlur" />
                <feComposite in="finalBlur" in2="finalBlur" operator="over" />
              </filter>
            </defs>
          </svg>

          {/* MINIMAL STICKY GLASSMORPHIC NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-[#9CE5EC]">

              {/* Brand */}
              <button
                onClick={() => setActiveTab('locator')}
                className="flex items-center gap-2.5 text-left focus:outline-none cursor-pointer"
              >
                <CognifyBrandMark />
                <span className="font-display font-semibold text-lg tracking-tight text-[#0b4757]">Cognify</span>
              </button>

              {/* Active-Pill Segmented Navigation */}
              <nav className="hidden md:flex items-center p-1 rounded-full bg-[#9CE5EC]/20 border border-[#9CE5EC]">
                {[
                  { id: 'locator', label: 'Locator' },
                  { id: 'matches', label: 'AI Matches', badge: enrichedMatches.filter((m) => m.step < 4).length },
                  { id: 'admin', label: currentUser ? `@${currentUser.username}` : 'Login / My Items' },
                ].map((tab) => {
                  const active = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`tactile-btn h-8 px-4 rounded-full text-xs font-medium inline-flex items-center gap-1.5 ${
                        active
                          ? 'bg-[#33B8C8] text-white'
                          : 'text-[#33B8C8] hover:text-[#0b4757]'
                      }`}
                    >
                      <span>{tab.label}</span>
                      {tab.badge > 0 && (
                        <span className={`font-mono-id text-[10px] px-1.5 py-0.2 rounded-full ${active ? 'bg-[#F8C12C] text-[#0b4757]' : 'bg-[#9CE5EC] text-[#0b4757]'}`}>
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Right Controls */}
              <div className="flex items-center gap-2">
                <div className="relative">

                      setNotifications((prev) => prev.map((n) => ({ ...n, unread: false })));

                    className="tactile-btn relative w-9 h-9 rounded-full border border-[#9CE5EC] bg-white hover:bg-[#9CE5EC]/20 flex items-center justify-center text-[#0b4757]"

                      <span className="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#F8C12C]" />

                  {notifOpen && (
                    <div className="absolute right-0 mt-2 w-80 bg-white rounded-2xl border border-[#9CE5EC] shadow-lg z-50 overflow-hidden animate-modal-in">
                      <div className="px-4 py-3 border-b border-[#9CE5EC] flex items-center justify-between bg-[#9CE5EC]/20">

                        <button onClick={() => setNotifOpen(false)} className="text-[#33B8C8] hover:text-[#0b4757]">
                          <Icon name="X" className="w-3.5 h-3.5" />

                      <div className="divide-y divide-[#9CE5EC]">
                        {notifications.map((n) => (
                          <div key={n.id} className="p-3.5">
                            <div className="flex items-center justify-between text-xs">
                              <span className="font-medium text-[#0b4757]">{n.title}</span>
                              <span className="font-mono-id text-[10px] text-[#33B8C8]">{n.time}</span>
                            </div>
                            <p className="text-xs text-[#33B8C8] mt-1">{n.desc}</p>
                          </div>

                      </div>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setMobileNavOpen((v) => !v)}
                  className="liquid-glass-btn md:hidden w-9 h-9 rounded-full border border-[#9CE5EC] bg-white/80 flex items-center justify-center text-[#0b4757]"
                  aria-label="Menu"
                >
                  <Icon name={mobileNavOpen ? 'X' : 'Menu'} className="w-4 h-4" />
                </button>
              </div>
            </div>

            {mobileNavOpen && (
              <div className="md:hidden border-t border-[#9CE5EC] bg-white px-4 py-3 flex flex-wrap gap-2">
                {[
                  { id: 'locator', label: 'Locator' },
                  { id: 'matches', label: 'AI Matches' },
                  { id: 'admin', label: currentUser ? `@${currentUser.username}` : 'Login / My Items' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveTab(tab.id); setMobileNavOpen(false); }}
                    className={`liquid-glass-btn h-9 px-4 rounded-full text-xs font-medium ${
                      activeTab === tab.id ? 'bg-[#33B8C8] text-white' : 'bg-[#9CE5EC]/20 text-[#33B8C8] border border-[#9CE5EC]'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* MAIN WORKSPACE */}
          <main className="flex-1">
            {/* =====================================================
                VIEW 1: LOCATOR HOME (SHADER HERO + AQUARIUM SEARCH + SCROLL ANIMATION + FEED)
               ===================================================== */}
            {activeTab === 'locator' && (
              <>
                {/* Top Animated Shader Hero with LiveOrb + Brand & Tagline */}
                <AnimatedShaderHero
                  onScrollToAquarium={() => {
                    const el = document.getElementById('aquarium-search-section');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                  }}
                  onScrollToFeed={() => {

                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                  }}
                />

                {/* Aquarium Theme Search Engine */}
                <section id="aquarium-search-section" className="hero-dot-grid relative border-b border-[#9CE5EC]">
                  <div className="max-w-5xl mx-auto px-4 sm:px-6 py-12 sm:py-16">

                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#9CE5EC]/20 border border-[#9CE5EC] text-xs font-medium text-[#33B8C8]">
                        <span className="relative flex h-2 w-2">
                          <span className="animate-ping-subtle absolute inline-flex h-full w-full rounded-full bg-[#F8C12C]" />
                          <span className="relative inline-flex rounded-full h-2 w-2 bg-[#F8C12C]" />

                        Cognify Item Radar · {items.filter((i) => i.status !== 'Reunited').length} active tags
                      </div>
                    </div>

                    {/* Interactive Pixel-Art Aquarium Search Engine */}
                    <AquariumPrompt
                      title="Find what matters on campus."
                      placeholder="Search lost headphones, wallets, IDs, or campus zone..."
                      onInputChange={(val) => setSearchQuery(val)}
                      onSubmit={(query) => {
                        setSearchQuery(query);
                        notify(`Filtering feed for "${query}"`);
                        const el = document.getElementById('public-item-feed');
                        if (el) el.scrollIntoView({ behavior: 'smooth' });

                    />

                    {/* Two Liquid Metal Action Buttons Redirecting to Google Forms (AI button removed) */}
                    <div className="mt-7 flex flex-wrap items-center justify-center gap-4">
                      <LiquidMetalButton
                        label="I Lost Something"

                          zoneFilter === 'ALL'
                            ? 'bg-[#33B8C8] border-[#33B8C8] text-white'
                            : 'bg-[#9CE5EC]/35 border-[#9CE5EC] text-[#0b4757] hover:border-[#33B8C8]'

                      >

                            }`}
                          >

                            <span className={`font-mono-id text-[11px] ${selected ? 'text-white/85' : 'text-[#33B8C8]'}`}>
                              {zoneCounts[z] || 0}

                          </button>

                      })}
                    </div>
                  </div>
                </section>

                {/* Text & Stack Scroll Animation Section */}
                <TextScrollSection />

                {/* PUBLIC ITEM FEED */}
                <section id="public-item-feed" className="max-w-6xl mx-auto px-4 sm:px-6 py-16">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                      <div className="flex items-center gap-2.5">
                        <h2 className="font-display font-semibold text-2xl text-[#0b4757]">Public Item Feed</h2>
                        <span
                          className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium border ${
                            dbStatus === 'live'
                              ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                              : dbStatus === 'error'
                              ? 'bg-red-50 border-red-200 text-red-700'
                              : 'bg-white border-[#9CE5EC] text-[#33B8C8]'
                          }`}
                        >
                          <span className={`w-1.5 h-1.5 rounded-full ${dbStatus === 'live' ? 'bg-emerald-500 animate-pulse' : dbStatus === 'error' ? 'bg-red-500' : 'bg-[#33B8C8]'}`} />
                          {dbStatus === 'live' ? 'Live Sync' : dbStatus === 'error' ? 'Sync Error' : 'Connecting...'}
                        </span>
                        <button
                          type="button"
                          onClick={() => fetchLiveItems(true)}
                          disabled={isSyncingDb}
                          className="tactile-btn h-7 px-2.5 rounded-full text-[11px] font-medium border border-[#9CE5EC] bg-white text-[#0b4757] hover:bg-[#9CE5EC]/20 disabled:opacity-60 cursor-pointer"
                        >

                        </button>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 mt-1">
                        <p className="text-sm text-[#33B8C8]">

                        </p>
                        {searchQuery && (
                          <button
                            type="button"
                            onClick={() => setSearchQuery('')}
                            className="liquid-glass-btn inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-[#9CE5EC]/45 text-[#0b4757] text-xs font-medium hover:bg-[#9CE5EC]"

                    {/* Minimal Filter Controls */}

                      {['ALL', 'Lost', 'Found', 'Reunited'].map((st) => (
